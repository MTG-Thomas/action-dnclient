name: "action-dnclient"
description: "Connect your GitHub Actions to a defined.net overlay network."
branding:
  icon: "share-2"
  color: "green"
inputs:
  dn-api-key:
    description: "Your defined.net API key used to enroll the GitHub Action"
    required: true
  dn-network-id:
    description: "Your defined.net networkID that the GitHub Action will enroll into."
    required: true
  dn-role-id:
    description: "The defined.net role for the GitHub Action will enroll into."
    required: true
  dn-ip-address:
    description: "If set to an IP in your defined.net network CIDR range it will enroll the host with that IP address."
    required: false
  dn-client-version:
    description: "The version of dnclient to install."
    required: false
  dn-hostname:
    description: "Set a static hostname for the action to use."
    required: false
    default: ""
  dn-cleanup:
    description: "Delete the enrolled ephemeral host when the job finishes (always runs, even on failure). Set to 'false' to keep it."
    required: false
    default: "true"
runs:
    using: "composite"
    steps:
      - name: Verify OS is Linux
        id: verify-os
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        run: |
          echo "This GitHub Action only runs on Linux!"
          exit 1

      - name: Clone MTG-Thomas/defined-systemd-units
        id: checkout-defined-systemd-units
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MTG-Thomas/defined-systemd-units
          ref: 6cc318a4f18374b5eec3eeb76c6c6dee33e92a59
          path: defined-systemd-units

      - name: Verify required inputs are set
        id: verify-required-inputs
        if: ${{ inputs.dn-api-key == '' || inputs.dn-network-id == '' || inputs.dn-role-id == '' }}
        shell: bash
        run: |
          echo "One of the following inputs are not set: dn-api-key, dn-network-id, dn-role-id. Ensure you have added them as Secrets for your workflow. See https://docs.github.com/en/actions/security-guides/encrypted-secrets"
          exit 1

      - name: Install defined-systemd-units
        id: install-defined-systemd-units
        shell: bash
        working-directory: defined-systemd-units
        run: |
          if [ -n "${{ inputs.dn-client-version }}" ]; then
            export DN_VERSION="${{ inputs.dn-client-version }}"
          fi
          sudo -E ./install

      - name: Configure defined-systemd-units
        id: configure-defined-systemd-units
        shell: bash
        working-directory: defined-systemd-units
        env:
          DN_API_KEY: ${{ inputs.dn-api-key }}
          DN_NETWORK_ID: ${{ inputs.dn-network-id }}
          DN_ROLE_ID: ${{ inputs.dn-role-id }}
          DN_HOSTNAME: ${{ inputs.dn-hostname }}
        run: |
          if [ -n "${{ inputs.dn-ip-address }}" ]; then
            export DN_IP_ADDRESS="${{ inputs.dn-ip-address }}"
          fi
          if [ -z "${DN_HOSTNAME}" ]; then
            export DN_NAME="github-action-$(hostname)"
          else
            export DN_NAME="${DN_HOSTNAME}"
          fi
          sudo -E dnctl write_config

      - name: Start dnclient.service unit
        id: start-dnclient-service-unit
        shell: bash
        env:
          DN_API_KEY: ${{ inputs.dn-api-key }}
          DN_NETWORK_ID: ${{ inputs.dn-network-id }}
        run: |
          # dnctl keys service/socket/config off DN_NETWORK_NAME (default
          # "defined"); resolve the real name so start and enroll agree.
          NETWORK_NAME="$(curl -fsSL -H "Authorization: Bearer ${DN_API_KEY}" \
            "https://api.defined.net/v2/networks/${DN_NETWORK_ID}" \
            | jq -r .data.name)"
          [ -n "${NETWORK_NAME}" ] && [ "${NETWORK_NAME}" != "null" ] || {
            echo "Could not resolve network name for ${DN_NETWORK_ID}" >&2
            exit 1
          }
          export DN_NETWORK_NAME="${NETWORK_NAME}"
          echo "DN_NETWORK_NAME=${NETWORK_NAME}" >> "${GITHUB_ENV}"
          sudo -E dnctl start

      - name: Enroll host into the overlay network
        id: enroll-host
        shell: bash
        env:
          DN_API_KEY: ${{ inputs.dn-api-key }}
          DN_NETWORK_ID: ${{ inputs.dn-network-id }}
          DN_ROLE_ID: ${{ inputs.dn-role-id }}
          DN_HOSTNAME: ${{ inputs.dn-hostname }}
        run: |
          set -x
          # dnctl enroll targets the legacy v1 enrollment endpoint, which
          # v2 (certVersion 2) networks reject (ERR_CERT_VERSION_2_INCOMPATIBLE).
          # Create the host plus enrollment code through the v2 API directly
          # and enroll dnclient with it, so failures surface here loudly.
          if [ -z "${DN_HOSTNAME}" ]; then
            export DN_NAME="github-action-$(hostname)"
          else
            export DN_NAME="${DN_HOSTNAME}"
          fi
          # The daemon must be up before enroll can dial its socket;
          # systemctl returns once the start job is queued, not when ready.
          # DN_NETWORK_NAME comes from the start step via GITHUB_ENV.
          for attempt in $(seq 1 15); do
            if [ -S "/var/run/defined/dnclient.${DN_NETWORK_NAME}.sock" ]; then
              break
            fi
            if [ "${attempt}" -eq 15 ]; then
              echo "dnclient socket never appeared; units:" >&2
              systemctl --no-pager list-units 'dnclient*' || true
              journalctl --no-pager -u 'dnclient*' -n 30 || true
              exit 1
            fi
            sleep 2
          done
          ENROLL_CODE="$(curl -fsSL -X POST -H "Authorization: Bearer ${DN_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"${DN_NAME}\",\"networkID\":\"${DN_NETWORK_ID}\",\"roleID\":\"${DN_ROLE_ID}\"}" \
            'https://api.defined.net/v2/host-and-enrollment-code' \
            | jq -r .data.enrollmentCode.code)"
          [ -n "${ENROLL_CODE}" ] && [ "${ENROLL_CODE}" != "null" ] || {
            echo "Host/code creation failed for ${DN_NAME}" >&2
            exit 1
          }
          sudo -E dnclient enroll -name "${NETWORK_NAME}" -code "${ENROLL_CODE}"
          echo "Enrolled ${DN_NAME}; waiting for the overlay interface"
          for attempt in $(seq 1 12); do
            if ip -brief addr show | grep -qE 'defined|nebula'; then
              ip -brief addr show | grep -E 'defined|nebula'
              exit 0
            fi
            sleep 5
          done
          echo "Overlay interface never appeared; dnclient units:" >&2
          systemctl --no-pager list-units 'dnclient*' || true
          journalctl --no-pager -u 'dnclient*' -n 30 || true
          exit 1
